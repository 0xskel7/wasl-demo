<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>وصل — العرض التجريبي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>:root{--bg:#12291F;--bg2:#0E2219;--card:#1F4535;--line:#2F5E4A;--row:#25503F;--row2:#285542;--mint:#A8D5BA;--mint2:#C2E3CF;--ink:#173A2C;--tx:#E9F0EC;--mut:#C3D6CB;--mut2:#B5CCBF;--paper:#FBFAF5;--ptx:#1E2A23}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif}
body{min-height:100vh}
a{color:var(--mint)}a:hover{color:var(--mint2)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hd{font-family:'Readex Pro',sans-serif}
.num{font-family:'Readex Pro',sans-serif;font-variant-numeric:tabular-nums}
.muted{color:var(--mut)}.muted2{color:var(--mut2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.shell{display:flex;min-height:100vh}
.side{width:248px;flex:none;background:var(--bg2);border-inline-start:1px solid #1C3A2D;padding:18px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand b{font-family:'Readex Pro';font-size:22px}
.brand small{display:block;font-size:11px;color:var(--mut2)}
.nav{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 12px;border-radius:12px;color:var(--mut);text-decoration:none;font-size:14px;border:0;background:transparent;width:100%;text-align:right;transition:background .2s}
.nav:hover{background:#1A3A2C;color:var(--tx)}
.nav.on{background:var(--mint);color:var(--ink);font-weight:700}
.nav .cnt{margin-inline-start:auto;font-size:11px;background:#2F5E4A;color:var(--tx);border-radius:99px;padding:1px 8px}
.nav.on .cnt{background:var(--ink);color:var(--mint)}
.navsec{font-size:11px;color:#7FA08D;padding:12px 12px 4px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid #1C3A2D;background:rgba(18,41,31,.92);position:sticky;top:0;z-index:5;backdrop-filter:blur(6px);flex-wrap:wrap}
.demo-pill{font-size:12px;background:#2A4A2F;border:1px solid var(--mint);color:var(--mint);border-radius:99px;padding:4px 10px;font-weight:600}
.page{padding:24px;display:flex;flex-direction:column;gap:16px;max-width:1440px;width:100%;margin:0 auto}
@media (max-width:900px){.shell{flex-direction:column}.side{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:10px}.side .navsec,.brand small,.side .sidefoot{display:none}.nav{width:auto;white-space:nowrap}.brand{padding:0 8px}.page{padding:14px}}

/* primitives */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px}
.card.hot{border:1.5px solid var(--mint)}
.card.dark{background:var(--bg2)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.split{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.split>.wide{flex:999 1 560px;min-width:0}
.split>.narrow{flex:1 1 320px;min-width:0}
.sp{flex:1}
h1.t{margin:0;font-family:'Readex Pro';font-weight:300;font-size:32px;line-height:1.3}
h1.t b{font-weight:600;color:var(--mint)}
h2.t{margin:0;font-family:'Readex Pro';font-weight:600;font-size:17px}
.kicker{font-size:13px;color:var(--mut2)}
.btn{min-height:42px;padding:0 16px;border-radius:12px;border:1px solid #40725C;background:transparent;color:var(--tx);font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:filter .2s,transform .15s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--mint);color:var(--ink);border-color:var(--mint);font-weight:700}
.btn.s{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.g{border-color:transparent;background:#25503F}
.chip{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:#2F5E4A;color:var(--tx);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.chip.m{background:var(--mint);color:var(--ink)}
.chip.o{background:transparent;border:1px solid var(--mint);color:var(--mint)}
.chip.d{background:transparent;border:1px dashed var(--mut2);color:var(--tx)}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:'Readex Pro';font-size:30px;font-weight:600}
.kpi .l{font-size:13px;color:var(--mut)}
.bar{height:8px;border-radius:8px;background:#2F5E4A;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:8px;background:var(--mint)}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;overflow-x:auto}
.tab{flex:1;min-height:40px;padding:0 14px;border:0;border-radius:10px;background:transparent;color:var(--mut);font-size:14px;white-space:nowrap}
.tab.on{background:var(--mint);color:var(--ink);font-weight:700}
.list>*+*{border-top:1px solid #285542}
.item{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 6px;border-radius:12px}
.item.click{cursor:pointer;transition:background .2s}
button.item,a.item{width:100%;background:none;border:0;color:inherit;font:inherit;text-align:right}
.card>.item:not(.click),.col>.item:not(.click){background:var(--row);padding:10px 12px}
.item.click:hover,.item.sel{background:var(--row2)}
.av{width:38px;height:38px;border-radius:12px;background:#2F5E4A;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.av.m{background:var(--mint);color:var(--ink)}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th{text-align:start;font-weight:500;color:var(--mut2);padding:8px 10px;border-bottom:1px solid var(--line)}
table.tb td{padding:11px 10px;border-bottom:1px solid #285542;vertical-align:middle}
table.tb tr.sel td{background:var(--row2)}
.scroll{overflow-x:auto}
label.f{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
.in{width:100%;min-height:44px;border-radius:12px;border:1px solid #40725C;background:var(--row);color:var(--tx);font-size:14px;padding:0 12px}
textarea.in{padding:10px 12px;min-height:80px;resize:vertical}
.in:focus{outline:2px solid var(--mint);outline-offset:1px}
.note{font-size:12px;color:var(--mut2);line-height:1.8}
.banner{border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#2A4A2F;border:1.5px solid var(--mint)}
.ico{width:40px;height:40px;border-radius:12px;background:var(--mint);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.ico.d{background:#2F5E4A;color:var(--mint)}

/* paper docs */
.paper{background:var(--paper);color:var(--ptx);border-radius:16px;padding:30px 34px;box-shadow:0 18px 40px rgba(0,0,0,.28);font-family:'Amiri','IBM Plex Sans Arabic',serif;font-size:15.5px;line-height:2}
.paper .ph{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:2px solid #1F4535;padding-bottom:10px;margin-bottom:14px;font-family:'IBM Plex Sans Arabic';line-height:1.6}
.paper .ph b{color:#1F4535;font-size:15px}
.paper .ph small{display:block;font-size:11px;color:#4B6355}
.paper h3{margin:0 0 10px;text-align:center;color:#1F4535;font-size:22px}
.paper p{margin:0 0 8px}
.paper table{width:100%;border-collapse:collapse;font-family:'IBM Plex Sans Arabic';font-size:13px;line-height:1.6;margin:6px 0 12px}
.paper td,.paper th{border:1px solid #CBD6CE;padding:7px 10px;text-align:start}
.paper th,.paper td.k{background:#EEF2EE;font-weight:600}
.fld{background:#DCEBE1;padding:0 6px;border-radius:4px}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:18px;font-family:'IBM Plex Sans Arabic';font-size:12px;margin-top:18px}
.sig div{border-top:1px solid var(--ptx);padding-top:6px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(10,26,19,.75);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--card);border:1px solid #40725C;border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:12px}
.dlg.w{max-width:760px}

/* toast */
.toast{position:fixed;bottom:20px;left:20px;z-index:60;background:var(--mint);color:var(--ink);font-weight:700;border-radius:14px;padding:12px 16px;box-shadow:0 12px 30px rgba(0,0,0,.3);max-width:420px;font-size:14px;line-height:1.7}

/* anim */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(168,213,186,.6)}100%{box-shadow:0 0 0 11px rgba(168,213,186,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes ripple{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.4);opacity:0}}
@keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,8px)}}
.anim .rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.anim .grow{transform-origin:right center;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
.pulse{animation:pulse 1.8s ease-out infinite}
.spin{animation:spin .9s linear infinite}
.caret{animation:blink 1s steps(1) infinite}
.pop{animation:pop .3s cubic-bezier(.2,.8,.2,1) both}
.slidein{animation:slidein .45s cubic-bezier(.2,.8,.2,1) both}
.ripple{animation:ripple 1.1s ease-out infinite}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mint);display:inline-block;flex:none}
.spinner{width:20px;height:20px;border-radius:50%;border:3px solid #2F5E4A;border-top-color:var(--mint);flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* calendar */
.evc{display:block;width:100%;text-align:right;border:0;border-right:3px solid var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--tx);border-radius:6px;padding:3px 6px;font-size:11px;font-weight:500;line-height:1.4;font-family:inherit;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.evc.sel,.calev.sel{outline:2px solid var(--c);outline-offset:1px}
.evc small{display:block;color:var(--mut2)}
.calm{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calh{font-size:12px;color:var(--mut2);text-align:center;padding:6px 0;font-weight:600}
.calc{min-height:104px;background:var(--row);border-radius:10px;padding:6px;overflow:hidden}
.calc.out{opacity:.4}.calc.we{background:color-mix(in srgb,var(--row) 60%,var(--bg))}
.calc.today{box-shadow:inset 0 0 0 2px var(--mint)}
.cald{background:none;border:0;color:var(--tx);font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;padding:2px 4px;border-radius:6px}
.calc.today .cald{background:var(--mint);color:var(--ink)}
.more{background:none;border:0;color:var(--mint);font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;padding:2px 0}
.calw{display:grid;gap:0 4px;min-width:100%}
.calwh{background:none;border:0;color:var(--tx);font-family:inherit;cursor:pointer;padding:6px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px}
.calwh small{color:var(--mut2);font-size:12px}.calwh b{font-size:20px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.calwh.today b{background:var(--mint);color:var(--ink)}
.calt{display:flex;flex-direction:column}.calt small{font-size:11px;color:var(--mut2);transform:translateY(-7px)}
.calcol{position:relative;background:var(--row);border-radius:10px;overflow:hidden}
.calcol.we{background:color-mix(in srgb,var(--row) 55%,var(--bg))}
.calcol>i{display:block;border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.calev{position:absolute;border:0;border-right:3px solid var(--c);background:color-mix(in srgb,var(--c) 22%,var(--card));color:var(--tx);border-radius:8px;padding:4px 6px;font-size:11px;font-weight:500;line-height:1.35;font-family:inherit;text-align:right;overflow:hidden;cursor:pointer;margin:0 2px}
.calev small{display:block;color:var(--mut2);margin-top:2px}
.calev em{position:absolute;bottom:3px;left:4px;font-style:normal;font-size:10px;background:#E9C46A;color:#173A2C;border-radius:6px;padding:0 5px;font-weight:700}
.nowl{position:absolute;right:0;left:0;height:2px;background:var(--mint);z-index:2}
.nowl::before{content:"";position:absolute;right:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--mint)}
@media(max-width:1100px){[style*="grid-column:span"]{grid-column:1/-1!important}}
/* phone + browser */
.phone{width:320px;max-width:100%;margin:0 auto;border-radius:38px;padding:12px;background:#0B1A13;box-shadow:0 0 0 2px #2F5E4A,0 30px 60px -30px #000}
.phone .scr{border-radius:28px;background:var(--paper);color:var(--ptx);min-height:560px;overflow:hidden;display:flex;flex-direction:column}
.bw{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#fff;color:#1E2A23}
.bw .bar2{display:flex;gap:8px;align-items:center;background:#E8EEEA;padding:8px 12px;font-size:12px;color:#3B5246}
.bw .url{flex:1;background:#fff;border-radius:8px;padding:4px 10px;direction:ltr;text-align:left;font-family:ui-monospace,monospace;font-size:12px}
.cursor{position:absolute;width:18px;height:18px;border-radius:50%;background:rgba(23,58,44,.25);border:2px solid #173A2C;transition:all .7s cubic-bezier(.5,0,.2,1);pointer-events:none;z-index:3}
.hl{outline:3px solid #A8D5BA;outline-offset:2px;border-radius:8px;transition:outline-color .3s}
.bub{max-width:82%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.7}
.bub.me{align-self:flex-start;background:var(--mint);color:var(--ink);border-bottom-left-radius:4px}
.bub.ai{align-self:flex-end;background:var(--row);border-bottom-right-radius:4px}
.step{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:6px 0}
.step i{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;background:var(--row);color:var(--mut2)}
.step.done i{background:var(--mint);color:var(--ink)}.step.now i{background:var(--tx);color:var(--ink);animation:pulse 1.4s infinite}
.step.todo{opacity:.55}

/* Najdi identity: Sadu band */

.top{border-bottom:0!important}
.topwrap{position:sticky;top:0;z-index:5}
.topwrap .top{position:static}
.paper{position:relative;overflow:hidden;padding-top:44px!important}
.paper::before{content:'';position:absolute;inset:0 0 auto 0;height:14px;background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='18' viewBox='0 0 28 18'><rect width='28' height='18' fill='%239C2F25'/><rect y='3' width='28' height='12' fill='%23F2E4CB'/><path fill='%233B2618' d='M0 15L14 8L28 15ZM0 -4L14 3L28 -4Z'/><path fill='%239C2F25' d='M0 9L14 5.2L28 9L14 12.8Z'/></svg>") repeat-x center/auto 100%}
.side{background-image:linear-gradient(var(--bg2),var(--bg2))}

  <div class="row rise" style="justify-content:center"><div class="tabs">${[[false, 'شهري'], [true, 'سنوي — شهران مجاناً']].map(([v, l]) => `<button class="tab ${PR.yearly === v ? 'on' : ''}" data-a="prYear" data-v="${v ? 1 : 0}">${l}</button>`).join('')}</div></div>
  <div class="grid g3">${PLANS.map((x) => `<article class="card col rise ${x.hot ? 'hot' : ''}" style="gap:12px;position:relative">${x.hot ? '<span class="chip m" style="position:absolute;top:-12px;right:18px">الأكثر طلباً</span>' : ''}
    <div><b class="hd" style="font-size:22px">${x.name}</b><br><small class="muted">${x.who} · ${x.users}</small></div>
    <div><small class="muted2" style="text-decoration:line-through">${fmt(yp(x.price))} ر.س</small><div class="row" style="gap:6px;align-items:baseline"><b class="num" style="font-size:40px;color:var(--mint)">${fmt(yp(x.pre))}</b><span class="muted">ر.س / شهرياً</span></div><small class="muted2">سعر الطلب المسبق${PR.yearly ? ' · يُدفع سنوياً' : ''} · غير شامل الضريبة</small></div>
    <div class="item" style="padding:10px 12px">${ic('spark', 16)}<b class="sp" style="font-size:13px">${x.ai}</b></div>
    <div class="col" style="gap:8px">${x.f.map((t) => `<div class="row" style="flex-wrap:nowrap;font-size:14px;gap:8px">${ic('check', 14, 3)}<span>${t}</span></div>`).join('')}</div>
    </article>`).join('')}</div>
  <div class="grid g2">
    <section class="card col rise"><h2 class="t">إذا تجاوزتم الحد؟</h2>
      <p class="muted" style="margin:0">المهمة الذكية = عملية واحدة ينفذها المساعد (تلخيص ملف، فتح ناجز، صياغة رسالة). لا يتوقف شيء عند التجاوز:</p>
      <table class="tb"><tbody><tr><td>كل 100 مهمة إضافية</td><td class="num"><b>9 ر.س</b></td></tr><tr><td>سقف شهري تختاره أنت</td><td>لا فاتورة مفاجئة</td></tr><tr><td>تنبيه عند 80% و 100%</td><td>للشريك المدير</td></tr><tr><td>رسائل الواتساب</td><td>على حساب Meta الخاص بمكتبك (≈ 4 هللات للتذكير)</td></tr></tbody></table></section>
    <section class="card col rise"><h2 class="t">ما يحصل عليه المكتب المبكر</h2>${[['tag', 'خصم 40% مثبت لمدة 24 شهراً'], ['users', 'إعداد ونقل بيانات المكتب مجاناً (Excel أو نظامكم الحالي)'], ['shield', 'بيئة مستقلة لكل مكتب ودخول بمفتاح مرور أو رمز ثنائي'], ['spark', 'صوت مباشر في تطوير المزايا القادمة'], ['x', 'إلغاء الطلب في أي وقت قبل التشغيل دون أي التزام']].map(([i, t]) => `<div class="item"><span class="ico">${ic(i, 16)}</span><span class="sp" style="font-size:14px">${t}</span></div>`).join('')}</section>
  </div>`;
};
ACT.prYear = (v) => { PR.yearly = v === '1'; render(); };
ACT.prPlan = (v) => { PR.plan = v; render(); };
ACT.prPick = (v) => { PR.plan = v; render(); const el = document.getElementById('preorder'); if (el) el.scrollIntoView({ behavior: 'smooth' }); };
INPUT.prF = (v, el) => { PR.f[el.dataset.k] = v; };
const WA_OWNER = ''; // رقم واتساب صاحب المنصة بصيغة 9665xxxxxxxx
ACT.prSend = () => {
  const p = PLANS.find((x) => x.id === PR.plan), f = PR.f, price = yp(p.pre), no = 'WSL-' + String(Date.now()).slice(-6);
  const txt = `طلب مسبق — منصة وصل\nرقم الطلب: ${no}\nالمكتب: ${f.office}\nالمسؤول: ${f.name}\nالجوال: ${f.phone}\nالمدينة: ${f.city} · المحامون: ${f.size}\nالباقة: ${p.name} (${PR.yearly ? 'سنوي' : 'شهري'}) — ${price} ر.س شهرياً\n${f.note ? 'ملاحظات: ' + f.note : ''}`;
  PR.done = { no, name: f.name, plan: p.name, price, txt, wa: 'https://wa.me/' + WA_OWNER + '?text=' + encodeURIComponent(txt) };
  render();
};
ACT.prCopy = () => { try { navigator.clipboard.writeText(PR.done.txt).then(() => toast('نُسخ الملخص.'), () => toast('تعذّر النسخ — استخدم زر الواتساب.')); } catch (e) { toast('تعذّر النسخ — استخدم زر الواتساب.'); } };
ACT.prAgain = () => { PR.done = null; render(); };

window.addEventListener('hashchange', onRoute);
onRoute();
</script></body></html>
